<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday 🎂</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0d0010;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'Georgia', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }

    /* ── Stars ── */
    #stars-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Petals ── */
    .petal {
      position: fixed;
      top: -60px;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
      opacity: 0.85;
    }

    @keyframes fall {
      0%   { transform: translateY(0)   rotate(0deg)   translateX(0); opacity: 0.9; }
      50%  { transform: translateY(50vh) rotate(180deg) translateX(30px); }
      100% { transform: translateY(110vh) rotate(360deg) translateX(-20px); opacity: 0; }
    }

    /* ── Card ── */
    #card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: clamp(28px, 7vw, 60px) clamp(20px, 6vw, 50px);
      max-width: 640px;
      width: 90%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 100, 150, 0.25);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 60px rgba(255, 50, 100, 0.15), 0 0 120px rgba(180, 0, 80, 0.08);
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .heart-icon {
      font-size: clamp(2rem, 8vw, 3.5rem);
      display: block;
      margin-bottom: 12px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.18); }
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      background: linear-gradient(135deg, #ff6eb4, #ff3377, #ff9ecd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: clamp(0.65rem, 2.5vw, 1rem);
      color: rgba(255, 200, 220, 0.7);
      letter-spacing: clamp(1px, 1vw, 4px);
      text-transform: uppercase;
      margin-bottom: clamp(16px, 4vw, 32px);
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff3377, transparent);
      margin: 0 auto clamp(16px, 4vw, 32px);
    }

    .message {
      color: rgba(255, 220, 235, 0.92);
      font-size: clamp(0.85rem, 2.8vw, 1.1rem);
      line-height: 1.9;
      font-style: italic;
      margin-top: 16px;
    }

    .name {
      display: inline-block;
      margin-top: clamp(16px, 4vw, 32px);
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      color: #ff6eb4;
      font-style: normal;
      letter-spacing: 1px;
    }

    /* ── Candles ── */
    .candles {
      display: flex;
      justify-content: center;
      gap: clamp(8px, 3vw, 16px);
      margin: clamp(16px, 5vw, 36px) 0 clamp(12px, 4vw, 28px);
    }

    .candle {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flame {
      width: 10px;
      height: 18px;
      background: radial-gradient(ellipse at 50% 70%, #fff 10%, #ffe066 40%, #ff9900 70%, transparent 100%);
      border-radius: 50% 50% 30% 30%;
      animation: flicker 0.6s ease-in-out infinite alternate;
      filter: blur(0.5px);
    }

    @keyframes flicker {
      0%   { transform: scaleX(1)   scaleY(1)   rotate(-2deg); opacity: 1; }
      100% { transform: scaleX(0.85) scaleY(1.15) rotate(2deg);  opacity: 0.85; }
    }

    .wick {
      width: 2px;
      height: 6px;
      background: #555;
    }

    .wax {
      width: 16px;
      height: 48px;
      border-radius: 3px 3px 4px 4px;
      position: relative;
    }

    .candle:nth-child(1) .wax { background: linear-gradient(180deg, #ff6eb4, #cc2255); }
    .candle:nth-child(2) .wax { background: linear-gradient(180deg, #b56bff, #6600cc); }
    .candle:nth-child(3) .wax { background: linear-gradient(180deg, #ff9ecd, #e0336b); }

    .cake-base {
      width: min(180px, 60%);
      height: 32px;
      background: linear-gradient(180deg, #ff6eb4 0%, #cc2255 100%);
      border-radius: 8px;
      margin: 0 auto;
      position: relative;
    }

    .cake-base::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 0; right: 0;
      height: 14px;
      background: #fff0f8;
      border-radius: 50%;
    }

    /* ── Fireworks canvas ── */
    #fw-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* ── Floating hearts ── */
    .float-heart {
      position: fixed;
      font-size: 1.4rem;
      pointer-events: none;
      z-index: 2;
      animation: floatUp linear forwards;
      opacity: 0;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(0.6); opacity: 0.9; }
      100% { transform: translateY(-80vh) scale(1.2); opacity: 0; }
    }

    /* ── Responsive tweaks ── */
    @media (max-width: 400px) {
      .wax  { width: 12px; height: 36px; }
      .flame { width: 8px; height: 14px; }
    }

    @media (max-height: 620px) and (orientation: landscape) {
      .heart-icon { font-size: 1.8rem; margin-bottom: 4px; }
      .candles    { margin: 8px 0 6px; }
      .wax        { height: 28px; }
      .flame      { height: 12px; }
      .cake-base  { height: 22px; }
    }
  </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<canvas id="fw-canvas"></canvas>

<div id="card">
  <span class="heart-icon">💖</span>
  <h1>Happy Birthday</h1>
  <p class="subtitle"></p>
  <div class="divider"></div>

  <div class="candles">
    <div class="candle"><div class="flame"></div><div class="wick"></div><div class="wax"></div></div>
    <div class="candle"><div class="flame"></div><div class="wick"></div><div class="wax"></div></div>
    <div class="candle"><div class="flame"></div><div class="wick"></div><div class="wax"></div></div>
  </div>
  <div class="cake-base"></div>

  <p class="message" id="message-text"></p>

  <span class="name" id="recipient-name">— Forever Yours 💕</span>
</div>

<script>
  /* ─── Config — edit these ─────────────────────────── */
  const RECIPIENT = "ADELA";          // name shown at top of card
  const SIGN_OFF  = "— axle"; // sign-off at the bottom
  const MESSAGE   = `Hi… I don't know if you still want to hear from me—<br>
    especially something as simple as a greeting—<br>
    but I just wanted you to know that I still remember you,<br>
    and you still cross my mind more often than you might think.<br><br>
    I genuinely hope your days are filled with peace and happiness,<br>
    and that the years ahead bring you growth, new experiences,<br>
    and people who truly love and care for you the way you deserve.<br><br>
    No matter where life takes you,<br>
    I'm wishing you nothing but the best — always.`;
  /* ─────────────────────────────────────────────────── */

  document.querySelector('h1').textContent = `Happy Birthday, ${RECIPIENT}!`;
  document.getElementById('message-text').innerHTML = MESSAGE;
  document.getElementById('recipient-name').innerHTML = SIGN_OFF;

  /* ── Stars ── */
  const starsCanvas = document.getElementById('stars-canvas');
  const sCtx = starsCanvas.getContext('2d');
  let stars = [];

  function resizeStars() {
    starsCanvas.width  = window.innerWidth;
    starsCanvas.height = window.innerHeight;
    stars = Array.from({ length: 160 }, () => ({
      x: Math.random() * starsCanvas.width,
      y: Math.random() * starsCanvas.height,
      r: Math.random() * 1.4 + 0.3,
      a: Math.random(),
      speed: Math.random() * 0.008 + 0.003,
    }));
  }

  function drawStars() {
    sCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
    stars.forEach(s => {
      s.a += s.speed;
      const alpha = (Math.sin(s.a) + 1) / 2;
      sCtx.beginPath();
      sCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      sCtx.fillStyle = `rgba(255,220,235,${alpha})`;
      sCtx.fill();
    });
    requestAnimationFrame(drawStars);
  }

  window.addEventListener('resize', resizeStars);
  resizeStars();
  drawStars();

  /* ── Petals ── */
  const petalShapes = ['🌸', '🌹', '🌺', '💮'];

  function spawnPetal() {
    const el = document.createElement('div');
    el.className = 'petal';
    el.textContent = petalShapes[Math.floor(Math.random() * petalShapes.length)];
    el.style.left      = Math.random() * 100 + 'vw';
    el.style.fontSize  = (Math.random() * 18 + 12) + 'px';
    const dur = Math.random() * 6 + 6;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay    = Math.random() * 4 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + 5) * 1000);
  }

  setInterval(spawnPetal, 600);
  for (let i = 0; i < 8; i++) spawnPetal();

  /* ── Floating hearts on click / tap ── */
  document.addEventListener('click', e => {
    for (let i = 0; i < 5; i++) {
      const h = document.createElement('div');
      h.className = 'float-heart';
      h.textContent = ['💗','💖','💓','💞','❤️'][Math.floor(Math.random()*5)];
      h.style.left = (e.clientX + (Math.random() - 0.5) * 60) + 'px';
      h.style.top  = e.clientY + 'px';
      h.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 3200);
    }
  });

  /* ── Fireworks ── */
  const fwCanvas = document.getElementById('fw-canvas');
  const fCtx     = fwCanvas.getContext('2d');
  fwCanvas.width  = window.innerWidth;
  fwCanvas.height = window.innerHeight;
  window.addEventListener('resize', () => {
    fwCanvas.width  = window.innerWidth;
    fwCanvas.height = window.innerHeight;
  });

  const particles = [];

  class Particle {
    constructor(x, y, color) {
      this.x  = x; this.y = y;
      this.vx = (Math.random() - 0.5) * 7;
      this.vy = (Math.random() - 0.5) * 7 - 2;
      this.alpha = 1;
      this.color = color;
      this.r = Math.random() * 2.5 + 1;
      this.gravity = 0.09;
      this.decay   = Math.random() * 0.018 + 0.012;
    }
    update() {
      this.vy += this.gravity;
      this.x  += this.vx;
      this.y  += this.vy;
      this.alpha -= this.decay;
    }
    draw() {
      fCtx.globalAlpha = Math.max(0, this.alpha);
      fCtx.beginPath();
      fCtx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      fCtx.fillStyle = this.color;
      fCtx.fill();
    }
  }

  function burst(x, y) {
    const hue    = Math.random() * 60 + 300; // pinks & purples
    const color  = `hsl(${hue},100%,70%)`;
    const color2 = `hsl(${hue + 30},100%,80%)`;
    for (let i = 0; i < 60; i++)
      particles.push(new Particle(x, y, i % 2 === 0 ? color : color2));
  }

  function animateFw() {
    fCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw();
      if (particles[i].alpha <= 0) particles.splice(i, 1);
    }
    fCtx.globalAlpha = 1;
    requestAnimationFrame(animateFw);
  }
  animateFw();

  function autoFirework() {
    const x = Math.random() * fwCanvas.width * 0.8 + fwCanvas.width * 0.1;
    const y = Math.random() * fwCanvas.height * 0.5 + 60;
    burst(x, y);
    setTimeout(autoFirework, Math.random() * 2200 + 1200);
  }
  autoFirework();
</script>
</body>
</html>
